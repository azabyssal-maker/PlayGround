<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Tesseract Runner</title>
  <style>
    :html,body{width:100%;height:100%;overflow:hidden;margin:0;background:#02040d;font-family:Inter,system-ui,sans-serif}
    *{box-sizing:border-box} canvas{display:block;width:100%;height:100%}
    #hud{position:fixed;inset:0;pointer-events:none;color:#eafcff;text-shadow:0 2px 12px #000}
    .top{position:absolute;top:max(18px,env(safe-area-inset-top));left:22px;right:22px;display:flex;justify-content:space-between;align-items:flex-start}
    .brand{font-weight:900;letter-spacing:.18em;font-size:12px;color:#7ffcff}.brand b{display:block;font-size:22px;letter-spacing:.06em;color:#fff;margin-top:3px}
    .stats{text-align:right;font-size:12px;letter-spacing:.12em}.stats strong{display:block;font-size:28px;color:#dff;font-family:ui-monospace,monospace}
    #bar{position:absolute;left:22px;bottom:max(22px,env(safe-area-inset-bottom));width:220px;height:5px;background:#18223b;border-radius:9px;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90,#62fbe9,#dc63ff);box-shadow:0 0 14px #71f9ff}
    #phase{position:absolute;right:22px;bottom:max(22px,env(safe-area-inset-bottom));font-size:11px;letter-spacing:.16em;color:#aeb8d5}
    #panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:auto;background:rgba(3,7,22,.72);backdrop-filter:blur(18px);border:1px solid rgba(151,244,255,.18);padding:34px 42px;border-radius:20px;min-width:min(420px,calc(100vw - 36px));box-shadow:0 24px 80px #000}
    #panel.hide{display:none}.eyebrow{color:#62e6db;font-size:11px;letter-spacing:.32em;font-weight:bold}h1{font-size:48px;margin:10px 0 8px;letter-spacing:-.04em}p{color:#aeb8d5;margin:0 0 24px;line-height:1.6;font-size:14px}button{pointer-events:auto;border:0;border-radius:100px;padding:14px 25px;font-weight:800;color:#061018;background:linear-gradient(135,#78fff1,#c7b4ff);cursor:pointer;box-shadow:0 8px 30px rgba(96,234,231,.25)}
    #help{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:10px;letter-spacing:.12em;color:#8793b3}
    #touch{display:none;position:absolute;inset:0}.zone{position:absolute;bottom:0;width:50%;height:42%}.left{left:0}.right{right:0}
    @media(max-width:700px){.brand b{font-size:17px}#panel{padding:28px 20px}h1{font-size:38px}.top{left:14px;right:14px}.stats strong{font-size:22px}#bar{left:14px;bottom:14px;width:150px}#phase{right:14px;bottom:14px}#help{display:none}#touch{display:block}}
  </style>
</head>
<body>
  <div id="hud">
    <div class="top"><div class="brand">HYPERLINK // 01 <b>TESSERACT RUNNER</b></div><div class="stats">DISTANCE<strong id="score">0000</strong></div></div>
    <div id="panel"><div class="eyebrow">TIME DISTORTION SYSTEM</div><h1 id="title">穿越中</h1><p id="desc">避开红色裂隙，收集青色核心。<br>按 空格 或点击屏幕 切换时间相位。</p><button id="start">启动跃迁</button></div>
    <div id="bar"><div class="fill" id="energy"></div></div><div id="phase">相位 <span id="phaseNum">A</span> · 4D TIME</div><div id="help">← → / A D 移动　　空格 切换相位</div>
    <div id="touch"><div class="zone left"></div><div class="zone right"></div></div>
  </div>
  <script type="module" src="/src.js"></script>
</body>
</html>
